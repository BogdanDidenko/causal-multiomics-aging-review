name: causal-aging-review

services:
  neo4j:
    image: neo4j:2026.07.1-community@sha256:dbc377fb9cd8fe8dabc19d3041b197d5ca0ef8bae514cea175b8df265e5b7a76
    container_name: causal-aging-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: none
      NEO4J_server_default__listen__address: 0.0.0.0
      NEO4J_server_bolt_advertised__address: localhost:7688
      NEO4J_server_http_advertised__address: localhost:7475
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ../../data/neo4j/retrieval_v0.1.0/import:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  neo4j_data:
    name: causal_aging_neo4j_data_v0_1_0
  neo4j_logs:
    name: causal_aging_neo4j_logs_v0_1_0
